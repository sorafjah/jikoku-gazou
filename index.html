<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>時刻入力で時計表示</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  body {
    font-family: "Inter", sans-serif; /* Tailwind CSSとの互換性を考慮 */
    text-align: center;
    padding: 20px;
    user-select: none;
    background-color: #f0f0f0; /* 背景色を追加 */
  }
  #input-section, #clock-display {
    margin: 20px auto;
  }
  input[type="number"] {
    font-size: 20px;
    padding: 8px;
    width: 80px;
    text-align: center;
    margin: 0 5px;
  }
  /* 時計のコンテナを中央に配置 */
  #clock-svg-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 40px;
  }
  svg {
    max-width: 300px;
    height: auto;
  }
</style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

<div id="app" class="bg-white p-8 rounded-lg shadow-xl max-w-md w-full">
  <h1 class="text-3xl font-bold mb-6 text-gray-800">時刻を入力して時計を表示</h1>

  <div id="input-section" class="mb-8">
    <p class="text-lg mb-4 text-gray-700">表示したい時刻を入力してください:</p>
    <div class="flex items-center justify-center space-x-2">
      <input type="number" id="hour-input" min="1" max="12" placeholder="時" value="6" 
             class="p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 w-24">
      <span class="text-3xl font-bold">:</span>
      <input type="number" id="minute-input" min="0" max="59" placeholder="分" value="30" 
             class="p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 w-24">
    </div>
    <div class="flex justify-center mt-6 space-x-4">
        <button id="display-clock-button" 
                class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md 
                       hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 
                       transition ease-in-out duration-150">
          時計を表示
        </button>
        <button id="download-button" 
                class="px-6 py-3 bg-green-600 text-white font-semibold rounded-lg shadow-md 
                       hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 
                       transition ease-in-out duration-150">
          画像をダウンロード
        </button>
    </div>
    <div id="error-message" class="text-red-500 text-sm mt-4 h-5"></div>
  </div>

  <div id="clock-display">
    <div id="clock-svg-container">
      <!-- 時計SVGがここに入る -->
    </div>
  </div>
</div>

<script>
  // DOM要素の取得
  const hourInput = document.getElementById("hour-input");
  const minuteInput = document.getElementById("minute-input");
  const displayClockButton = document.getElementById("display-clock-button");
  const downloadButton = document.getElementById("download-button"); // ダウンロードボタンを追加
  const clockSvgContainer = document.getElementById("clock-svg-container");
  const errorMessageDiv = document.getElementById("error-message");

  // 時計の描画に必要な定数 (SVG座標系)
  const radius = 120; // 時計の円の半径
  const centerX = 150; // 時計の中心X座標
  const centerY = 150; // 時計の中心Y座標

  /**
   * 指定された時刻に基づいてアナログ時計のSVGを描画します。
   * @param {number} hour - 表示する時間 (1-12)
   * @param {number} minute - 表示する分 (0-59)
   * @returns {SVGElement} - 生成されたSVG要素
   */
  function drawClock(hour, minute) {
    const svgNS = "http://www.w3.org/2000/svg"; // SVG名前空間

    // SVG要素の作成
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 300 300"); // 300x300のビューボックス
    svg.setAttribute("width", "300");
    svg.setAttribute("height", "300");
    svg.setAttribute("class", "shadow-md"); 

    // 時計の外円の描画
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", centerX);
    circle.setAttribute("cy", centerY);
    circle.setAttribute("r", radius);
    circle.setAttribute("stroke", "black");
    circle.setAttribute("stroke-width", "3");
    circle.setAttribute("fill", "white");
    svg.appendChild(circle);

    // 文字盤の数字 (1-12) の描画
    for(let i = 1; i <= 12; i++) {
      const angle = (i * 30 - 90) * Math.PI / 180; // 角度計算 (0時が真上、時計回りに増加)
      const x = centerX + (radius - 30) * Math.cos(angle); // 数字のX座標
      const y = centerY + (radius - 30) * Math.sin(angle) + 6; // 数字のY座標 (垂直方向の微調整)
      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", "middle"); // 中央揃え
      text.setAttribute("font-size", "20");
      text.setAttribute("fill", "#333"); // 文字色
      text.textContent = i;
      svg.appendChild(text);
    }

    // 分目盛り (60個) の描画
    for(let i = 0; i < 60; i++) {
      const angle = (i * 6 - 90) * Math.PI / 180; // 角度計算
      const innerRadius = (i % 5 === 0) ? radius - 15 : radius - 8; // 5分ごとは長く、それ以外は短い
      const outerX = centerX + radius * Math.cos(angle);
      const outerY = centerY + radius * Math.sin(angle);
      const innerX = centerX + innerRadius * Math.cos(angle);
      const innerY = centerY + innerRadius * Math.sin(angle);

      const line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", innerX);
      line.setAttribute("y1", innerY);
      line.setAttribute("x2", outerX);
      line.setAttribute("y2", outerY);
      line.setAttribute("stroke", "black");
      line.setAttribute("stroke-width", (i % 5 === 0) ? 2 : 1); // 5分ごとは太く
      svg.appendChild(line);
    }

    // 時針の描画
    const hourAngle = ((hour % 12) + minute / 60) * 30 - 90; // 時針の角度 (分に応じて動く)
    const hourX = centerX + (radius * 0.5) * Math.cos(hourAngle * Math.PI / 180);
    const hourY = centerY + (radius * 0.5) * Math.sin(hourAngle * Math.PI / 180);
    const hourHand = document.createElementNS(svgNS, "line");
    hourHand.setAttribute("x1", centerX);
    hourHand.setAttribute("y1", centerY);
    hourHand.setAttribute("x2", hourX);
    hourHand.setAttribute("y2", hourY);
    hourHand.setAttribute("stroke", "#333"); // 時針の色
    hourHand.setAttribute("stroke-width", 6);
    hourHand.setAttribute("stroke-linecap", "round"); // 端を丸める
    svg.appendChild(hourHand);

    // 分針の描画
    const minuteAngle = minute * 6 - 90; // 分針の角度
    const minuteX = centerX + (radius * 0.75) * Math.cos(minuteAngle * Math.PI / 180);
    const minuteY = centerY + (radius * 0.75) * Math.sin(minuteAngle * Math.PI / 180);
    const minuteHand = document.createElementNS(svgNS, "line");
    minuteHand.setAttribute("x1", centerX);
    minuteHand.setAttribute("y1", centerY);
    minuteHand.setAttribute("x2", minuteX);
    minuteHand.setAttribute("y2", minuteY);
    minuteHand.setAttribute("stroke", "#333"); // 分針の色
    minuteHand.setAttribute("stroke-width", 4);
    minuteHand.setAttribute("stroke-linecap", "round"); // 端を丸める
    svg.appendChild(minuteHand);

    // 中心点の描画
    const centerDot = document.createElementNS(svgNS, "circle");
    centerDot.setAttribute("cx", centerX);
    centerDot.setAttribute("cy", centerY);
    centerDot.setAttribute("r", 6);
    centerDot.setAttribute("fill", "#333"); // 中心点の色
    svg.appendChild(centerDot);

    return svg;
  }

  // 「時計を表示」ボタンのイベントリスナー
  displayClockButton.addEventListener("click", () => {
    // 入力値の取得と数値への変換
    const hour = parseInt(hourInput.value);
    const minute = parseInt(minuteInput.value);

    // 入力値のバリデーション
    if (isNaN(hour) || isNaN(minute) || hour < 1 || hour > 12 || minute < 0 || minute > 59) {
      errorMessageDiv.textContent = "正しい時刻（時: 1-12, 分: 0-59）を入力してください。";
      clockSvgContainer.innerHTML = ""; // エラーの場合は時計をクリア
      return; // 処理を中断
    }

    // バリデーションが成功したらエラーメッセージをクリア
    errorMessageDiv.textContent = ""; 
    // 既存の時計をクリア
    clockSvgContainer.innerHTML = ""; 
    // 新しい時刻で時計を描画し、コンテナに追加
    clockSvgContainer.appendChild(drawClock(hour, minute)); 
  });

  // 「画像をダウンロード」ボタンのイベントリスナー
  downloadButton.addEventListener("click", () => {
    const svgElement = clockSvgContainer.querySelector("svg"); // 表示されているSVG要素を取得

    if (!svgElement) {
      errorMessageDiv.textContent = "まず時刻を入力して時計を表示してください。";
      return;
    }

    // SVGをXML文字列に変換
    const svgData = new XMLSerializer().serializeToString(svgElement);
    const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    // 一時的なImageオブジェクトを作成し、SVGを読み込む
    const img = new Image();
    img.onload = () => {
      // Canvas要素を作成
      const canvas = document.createElement("canvas");
      // SVGのviewBoxから幅と高さを取得（ここでは固定値300x300）
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext("2d");

      // CanvasにSVG画像を描画
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Canvasの内容をPNG形式のデータURLとして取得
      const pngUrl = canvas.toDataURL("image/png");

      // ダウンロード用のリンクを作成し、クリックイベントをシミュレート
      const downloadLink = document.createElement("a");
      downloadLink.href = pngUrl;
      // ダウンロードファイル名
      downloadLink.download = `時計_${hourInput.value.padStart(2, '0')}${minuteInput.value.padStart(2, '0')}.png`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink); // リンクを削除
      URL.revokeObjectURL(url); // オブジェクトURLを解放
    };
    img.onerror = () => {
        errorMessageDiv.textContent = "画像の読み込みに失敗しました。";
        URL.revokeObjectURL(url);
    };
    img.src = url; // ImageオブジェクトにSVGのURLを設定
  });

  // ページ読み込み時にデフォルト値で時計を初期表示
  displayClockButton.click(); 
</script>

</body>
</html>
